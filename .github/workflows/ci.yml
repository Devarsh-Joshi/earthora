name: Website CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  website-and-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:schema
      - run: npm run build
